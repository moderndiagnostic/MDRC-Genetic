<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#005E91"/>
      <stop offset="1" stop-color="#0C759A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15AEE5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#15AEE5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="strand" x1="0" y1="0" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8E6F8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#B8E6F8"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="220" fill="url(#glow)"/>
  <circle cx="60" cy="440" r="180" fill="url(#glow)"/>

  <!-- soft floating cells -->
  <circle cx="120" cy="90" r="10" fill="#ffffff" opacity="0.18"/>
  <circle cx="700" cy="380" r="14" fill="#ffffff" opacity="0.15"/>
  <circle cx="640" cy="90" r="7" fill="#ffffff" opacity="0.2"/>
  <circle cx="90" cy="330" r="8" fill="#ffffff" opacity="0.2"/>

  <!-- DNA double helix, right side -->
  <g transform="translate(560,40)" opacity="0.95">
    <path d="M0 0 C 50 40, -30 80, 20 120 C 70 160, -10 200, 40 240 C 90 280, 10 320, 60 360 C 90 384, 70 400, 90 410"
          stroke="url(#strand)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M90 0 C 40 40, 120 80, 70 120 C 20 160, 100 200, 50 240 C 0 280, 80 320, 30 360 C 0 384, 20 400, 0 410"
          stroke="url(#strand)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.55">
      <line x1="14" y1="18" x2="76" y2="18"/>
      <line x1="4" y1="58" x2="86" y2="58"/>
      <line x1="18" y1="98" x2="72" y2="98"/>
      <line x1="8" y1="138" x2="82" y2="138"/>
      <line x1="20" y1="178" x2="70" y2="178"/>
      <line x1="6" y1="218" x2="84" y2="218"/>
      <line x1="18" y1="258" x2="72" y2="258"/>
      <line x1="8" y1="298" x2="82" y2="298"/>
      <line x1="20" y1="338" x2="70" y2="338"/>
      <line x1="10" y1="378" x2="80" y2="378"/>
    </g>
  </g>

  <!-- Protective/maternal care motif: heart holding a tiny embryo curve, left-center -->
  <g transform="translate(150,140)">
    <path d="M120 40
             C 120 -10, 40 -10, 40 45
             C 40 100, 120 150, 120 190
             C 120 150, 200 100, 200 45
             C 200 -10, 120 -10, 120 40 Z"
          fill="#ffffff" opacity="0.14"/>
    <circle cx="120" cy="95" r="34" fill="url(#dot)" opacity="0.95"/>
    <path d="M108 85 q 12 -14 24 0 q 6 8 -4 16 q -8 8 -16 0 q -10 -8 -4 -16 Z" fill="#0C759A" opacity="0.35"/>
    <circle cx="120" cy="95" r="34" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Blood drop / test sample icon, bottom left -->
  <g transform="translate(90,300)">
    <path d="M30 0 C 46 24, 60 42, 60 60 C 60 79, 47 94, 30 94 C 13 94, 0 79, 0 60 C 0 42, 14 24, 30 0 Z"
          fill="#ffffff" opacity="0.9"/>
    <path d="M30 0 C 46 24, 60 42, 60 60 C 60 79, 47 94, 30 94 C 13 94, 0 79, 0 60 C 0 42, 14 24, 30 0 Z"
          fill="#15AEE5" opacity="0.35"/>
    <circle cx="22" cy="55" r="7" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- test tube -->
  <g transform="translate(210,330)">
    <rect x="0" y="0" width="26" height="70" rx="13" fill="#ffffff" opacity="0.85"/>
    <rect x="0" y="30" width="26" height="40" rx="13" fill="#15AEE5" opacity="0.6"/>
    <rect x="-4" y="-10" width="34" height="10" rx="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- text lockup -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
    <text x="18" y="23" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">NON-INVASIVE PRENATAL TESTING</text>
  </g>
</svg>
